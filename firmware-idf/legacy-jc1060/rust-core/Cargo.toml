[package]
name = "ruzina-legacy-idf-core-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
ruzina-deck = { path = "../../../firmware-rust/crates/ruzina-deck" }
ruzina-audio-dsp = { path = "../../../firmware-rust/crates/ruzina-audio-dsp", optional = true }
ruzina-media-block = { path = "../../../firmware-rust/crates/ruzina-media-block", optional = true }
ruzina-media-io = { path = "../../../firmware-rust/crates/ruzina-media-io", optional = true }
ruzina-media-session = { path = "../../../firmware-rust/crates/ruzina-media-session", optional = true }
ruzina-media-partition = { path = "../../../firmware-rust/crates/ruzina-media-partition", optional = true }
ruzina-media-exfat = { path = "../../../firmware-rust/crates/ruzina-media-exfat", optional = true }
ruzina-media-fs = { path = "../../../firmware-rust/crates/ruzina-media-fs", optional = true }
ruzina-media-catalog = { path = "../../../firmware-rust/crates/ruzina-media-catalog", optional = true }
ruzina-media-load = { path = "../../../firmware-rust/crates/ruzina-media-load", optional = true }
ruzina-media-identity = { path = "../../../firmware-rust/crates/ruzina-media-identity", optional = true }
ruzina-controller-core = { path = "../../../firmware-rust/crates/ruzina-controller-core", optional = true }
ruzina-controller-profile = { path = "../../../firmware-rust/crates/ruzina-controller-profile", optional = true }
ruzina-controller-session = { path = "../../../firmware-rust/crates/ruzina-controller-session", optional = true }
ruzina-uac = { path = "../../../firmware-rust/crates/ruzina-uac", optional = true }
ruzina-audio-runtime = { path = "../../../firmware-rust/crates/ruzina-audio-runtime", optional = true }
ruzina-mixer = { path = "../../../firmware-rust/crates/ruzina-mixer", optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }

[features]
memory-task = ["dep:ruzina-audio-dsp"]
media-bridge = ["dep:ruzina-media-block", "dep:ruzina-media-io", "dep:ruzina-media-session"]
idf-media-bridge = ["media-bridge"]
exfat-fixture = ["media-bridge", "dep:ruzina-media-partition", "dep:ruzina-media-exfat", "dep:ruzina-media-fs", "dep:sha2"]
idf-exfat-fixture = ["idf-media-bridge", "exfat-fixture"]
media-load = [
    "exfat-fixture",
    "dep:ruzina-media-catalog",
    "dep:ruzina-media-identity",
    "dep:ruzina-media-load",
]
# Target form: Rust allocations come from the IDF PSRAM heap (idf_alloc).
idf-media-load = ["idf-exfat-fixture", "media-load"]
controller-midi = [
    "dep:ruzina-controller-core",
    "dep:ruzina-controller-profile",
    "dep:ruzina-controller-session",
]
# USB-MIDI from the IDF USB host diagnostic into the semantic session.
idf-controller-midi = ["controller-midi"]
controller-audio = ["controller-midi", "dep:ruzina-uac", "dep:ruzina-audio-dsp"]
# UAC1 headphone tone to the controller over the IDF USB host.
idf-controller-audio = ["idf-controller-midi", "controller-audio"]
deck-play = ["controller-audio", "media-load", "dep:ruzina-audio-runtime"]
# Deck 1 decoded from the card to the controller headphones over UAC1.
idf-deck-play = ["idf-controller-audio", "idf-media-load", "deck-play"]
deck-mix = ["deck-play", "dep:ruzina-mixer"]
# Both decks through the product render graph to MAIN and the headphones.
idf-deck-mix = ["idf-deck-play", "deck-mix"]

[dev-dependencies]
ruzina-core = { path = "../../../firmware-rust/crates/ruzina-core" }

[profile.release]
panic = "abort"
opt-level = "s"

[workspace]
