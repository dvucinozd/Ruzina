name: Legacy P4 IDF build only
on:
  push:
    branches: [main]
    paths: ['firmware-idf/**', 'firmware-rust/crates/**', 'firmware-rust/Cargo.*', 'firmware-rust/tools/check_docs.py', 'docs/**', 'tools/resource_readiness/**', 'tools/normal_engine/**', 'tools/source_supply/**', 'tools/source_budget/**', '.github/workflows/legacy-idf.yml']
  pull_request:
    paths: ['firmware-idf/**', 'firmware-rust/crates/**', 'firmware-rust/Cargo.*', 'firmware-rust/tools/check_docs.py', 'docs/**', 'tools/resource_readiness/**', 'tools/normal_engine/**', 'tools/source_supply/**', 'tools/source_budget/**', '.github/workflows/legacy-idf.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  media-bridge-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guarded campaign host fault paths (no device)
        run: |
          python3 -m unittest discover -s tools/resource_readiness/tests -v
          python3 -m unittest discover -s tools/normal_engine/tests -v
          python3 -m unittest discover -s tools/source_supply/tests -v
          python3 -m unittest discover -s tools/source_budget/tests -v
          python3 tools/source_budget/verify_vendor.py
      - name: Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.95.0 riscv32imafc-unknown-none-elf
      - name: Owned-buffer and cancellation contract
        run: |
          manifest=firmware-idf/legacy-jc1060/rust-core/Cargo.toml
          cargo +1.95.0 fmt --manifest-path "$manifest" -- --check
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-media-load
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-media-load --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-controller-audio
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-controller-audio --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-deck-play
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-deck-play --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-deck-mix
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-deck-mix --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-deck-engine
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-deck-engine --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-uac-profile
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-uac-profile --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-producer-profile
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-producer-profile --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features idf-soak-autoplay
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features idf-soak-autoplay --tests -- -D warnings
          # The deck screen image without Wi-Fi, and as flashed on the board, with its Wi-Fi
          # and Web Remote.
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features "idf-soak-autoplay idf-slint-ui"
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features "idf-soak-autoplay idf-slint-ui" --tests -- -D warnings
          cargo +1.95.0 test --locked --manifest-path "$manifest" --features "idf-soak-autoplay idf-web-remote"
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" --features "idf-soak-autoplay idf-web-remote" --tests -- -D warnings
          for features in idf-exfat-fixture idf-media-load idf-controller-midi "idf-media-load idf-controller-midi" "idf-media-load idf-controller-audio" idf-deck-play idf-deck-mix idf-deck-engine idf-uac-profile idf-producer-profile idf-soak-autoplay "idf-soak-autoplay idf-slint-ui" "idf-soak-autoplay idf-slint-ui idf-web-remote" "idf-uac-profile idf-soak-autoplay idf-slint-ui" "idf-uac-profile idf-soak-autoplay idf-slint-ui idf-web-remote"; do
            cargo +1.95.0 clippy --locked --release --manifest-path "$manifest" --features "$features" --target riscv32imafc-unknown-none-elf -- -D warnings
            cargo +1.95.0 build --locked --release --manifest-path "$manifest" --features "$features" --target riscv32imafc-unknown-none-elf
          done
          # The deck screen's draw crate, built for speed apart from the core.
          cargo +1.95.0 clippy --locked --manifest-path "$manifest" -p ruzina-screen-lines -- -D warnings
          cargo +1.95.0 clippy --locked --release --manifest-path "$manifest" -p ruzina-screen-lines --target riscv32imafc-unknown-none-elf -- -D warnings
  legacy:
    runs-on: ubuntu-latest
    env:
      IDF_COMMIT: fff9895c82d744c7237be8847347bdd1b07c6643
    strategy:
      # One variant's infrastructure failure must not cancel the others.
      fail-fast: false
      matrix:
        variant: [pure-ram, flash-build-only, memory-task, display-touch, sd-readonly, sd-file-readonly, sd-rust-bridge, sd-rust-exfat, sd-rust-load, sd-rust-load-display, usb-host, usb-midi, deck-ui, deck-audio, deck-play, deck-mix, deck-engine]
        profile: [false]
        producer_profile: [false]
        slint: [false]
        include:
          # The deck screen image reading the SD card, and its fill-profile build.
          - variant: deck-engine
            slint: true
          - variant: deck-engine
            slint: true
            profile: true
          # The deck screen reading its media from a USB stick behind a hub on HS: the play
          # image's flags. A CI build checks the source; it is not the image the board keeps.
          - variant: deck-engine
            slint: true
            usb_stick: true
          - variant: deck-engine
            profile: true
          - variant: deck-engine
            profile: true
            pack_iram: true
          - variant: deck-engine
            producer_profile: true
            profile: false
          - variant: deck-engine
            producer_profile: true
            profile: false
            mp3_core_opt3: true
    name: legacy (${{ matrix.variant }}${{ matrix.slint && '-slint' || '' }}${{ matrix.profile && '-profile' || '' }}${{ matrix.pack_iram && '-pack-iram' || '' }}${{ matrix.producer_profile && '-producer-profile' || '' }}${{ matrix.mp3_core_opt3 && '-mp3-core-opt3' || '' }}${{ matrix.usb_stick && '-usb-stick' || '' }})
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup target add --toolchain 1.95.0 riscv32imafc-unknown-none-elf
      # The downloaded tool archives only: install.sh verifies each archive's
      # checksum and unpacks it, and builds its Python environment every run.
      - name: IDF tool archives
        uses: actions/cache@v4
        with:
          path: ~/.espressif/dist
          key: idf-dist-${{ runner.os }}-${{ env.IDF_COMMIT }}-esp32p4
      - name: Pinned IDF
        shell: bash
        run: |
          # GitHub downloads fail now and then, on a different file each time.
          retry() {
            local attempt
            for attempt in 1 2 3; do
              "$@" && return 0
              [ "$attempt" = 3 ] || { echo "::warning::attempt $attempt failed: $*"; sleep $((attempt * 60)); }
            done
            return 1
          }
          fresh_clone() {
            rm -rf "$RUNNER_TEMP/idf"
            git clone --no-checkout https://github.com/espressif/esp-idf.git "$RUNNER_TEMP/idf"
          }
          retry fresh_clone
          git -C "$RUNNER_TEMP/idf" checkout "$IDF_COMMIT"
          retry git -C "$RUNNER_TEMP/idf" submodule update --init --recursive
          retry "$RUNNER_TEMP/idf/install.sh" esp32p4
          # The builder checks esptool 5.6.0, the board's toolchain. IDF's requirements let
          # pip take a newer one (5.7.0 on 2026-11-25), so it is pinned back here.
          . "$RUNNER_TEMP/idf/export.sh"
          retry python -m pip install 'esptool==5.6.0'
      - name: Offline tests and fresh build
        shell: bash
        run: |
          . "$RUNNER_TEMP/idf/export.sh"
          python firmware-rust/tools/check_docs.py
          python -m unittest discover -s firmware-idf/legacy-jc1060/tools/tests -v
          python firmware-idf/legacy-jc1060/tools/build_legacy.py --idf "$IDF_PATH" --variant '${{ matrix.variant }}' ${{ matrix.slint && '--soak-autoplay --slint-ui --fill-iram' || '' }} ${{ matrix.profile && '--uac-profile' || '' }} ${{ matrix.pack_iram && '--uac-pack-iram' || '' }} ${{ matrix.producer_profile && '--producer-profile' || '' }} ${{ matrix.mp3_core_opt3 && '--mp3-core-opt3' || '' }} ${{ matrix.usb_stick && '--usb-stick' || '' }} --output "$RUNNER_TEMP/legacy-${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.variant }}${{ matrix.slint && '-slint' || '' }}${{ matrix.profile && '-profile' || '' }}${{ matrix.pack_iram && '-pack-iram' || '' }}${{ matrix.producer_profile && '-producer-profile' || '' }}${{ matrix.mp3_core_opt3 && '-mp3-core-opt3' || '' }}${{ matrix.usb_stick && '-usb-stick' || '' }}-BUILD-ONLY
          path: |
            ${{ runner.temp }}/legacy-${{ matrix.variant }}/manifest.json
            ${{ runner.temp }}/legacy-${{ matrix.variant }}/*build.log
            ${{ runner.temp }}/legacy-${{ matrix.variant }}/build/ruzina_legacy_probe.*
