name: Rust host foundation

# Cargo.lock is committed; dependency resolution is intentionally --locked.

on:
  push:
    branches: [main]
    paths:
      - "firmware-rust/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/rust-host.yml"
  pull_request:
    paths:
      - "firmware-rust/**"
      - "docs/**"
      - "README.md"
      - ".github/workflows/rust-host.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Slint Linux dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libfontconfig1-dev \
            libx11-xcb-dev \
            xinput \
            libxcursor-dev \
            libxkbcommon-x11-dev \
            libx11-dev \
            fonts-dejavu-core

      - name: Check repository documentation links
        run: python3 tools/check_docs.py

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.95.0

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --locked --workspace

      - name: Desktop simulator compile gate
        run: cargo check --locked -p desktop-simulator

      - name: Experimental APTA core portability and product exclusion
        run: |
          rustup target add --toolchain 1.95.0 riscv32imafc-unknown-none-elf
          cargo check --locked -p pajoniiir-apta-adapter --lib --no-default-features --target riscv32imafc-unknown-none-elf
          python3 tools/check_apta_core_boundary.py

      - name: Experimental APTA worker lifecycle and current product handoff
        run: |
          cargo clippy --locked -p pajoniiir-apta-adapter --all-features --all-targets -- -D warnings
          cargo test --locked -p pajoniiir-apta-adapter --all-features --release
          cargo check --locked -p pajoniiir-apta-adapter --lib --features owned-handoff --target riscv32imafc-unknown-none-elf

      - name: Repeated APTA owner lifecycle and Guition package tools
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 tools/run_apta_stress.py --iterations 25 --output target/apta-stress

      - name: Composed runtime owner recovery evidence
        run: |
          mkdir -p target
          cargo test --locked -p pajoniiir-service --features runtime-owners --test runtime_owners -- --nocapture --test-threads=1 > target/runtime-owners.log 2>&1
          cargo clippy --locked -p pajoniiir-service --features runtime-owners --tests -- -D warnings
          cargo test --locked -p pajoniiir-service --features runtime-owners --test composed_failures -- --nocapture --test-threads=1 > target/composed-failures.log 2>&1

      - name: Interactive UI and screenshot goldens
        run: |
          cargo run --locked -p desktop-simulator -- --smoke target/ui-smoke
          python3 tools/check_ui_goldens.py target/ui-smoke

      - name: Retain UI snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slint-ui-snapshots
          path: |
            firmware-rust/target/ui-smoke/*.ppm
            firmware-rust/target/ui-smoke/*.txt
            firmware-rust/target/runtime-owners.log
            firmware-rust/target/composed-failures.log
            firmware-rust/target/apta-stress/**
