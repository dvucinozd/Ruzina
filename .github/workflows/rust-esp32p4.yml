name: Rust ESP32-P4 compile gate

# Firmware Cargo.lock is committed; dependency resolution is intentionally --locked.

on:
  pull_request:
    paths:
      - "firmware-rust/apps/m1-firmware/**"
      - "firmware-rust/crates/**"
      - "firmware-rust/rust-toolchain.toml"
      - ".github/workflows/rust-esp32p4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-rust/apps/m1-firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 riscv32imafc-unknown-none-elf

      - name: ESP32-P4 default cross compile
        run: cargo +1.95.0 check --locked

      - name: ESP32-P4 default link gate
        run: cargo +1.95.0 build --locked --release

      - name: ESP32-P4 USB0 bring-up cross compile
        run: cargo +1.95.0 check --locked --features usb0-hardware-bringup

      - name: ESP32-P4 USB0 bring-up link gate
        run: cargo +1.95.0 build --locked --release --features usb0-hardware-bringup

      - name: ESP32-P4 PSRAM storage boundary cross compile
        run: cargo +1.95.0 check --locked --features p4-psram-storage

      - name: ESP32-P4 USB0 + PSRAM combined link gate
        run: cargo +1.95.0 build --locked --release --features "usb0-hardware-bringup,p4-psram-storage"
