name: Rust ESP32-P4 compile gate

# Firmware Cargo.lock is committed; dependency resolution is intentionally --locked.

on:
  push:
    branches: [main]
    paths:
      - "firmware-rust/apps/m1-firmware/**"
      - "firmware-rust/crates/**"
      - "firmware-rust/rust-toolchain.toml"
      - "firmware-rust/tools/**"
      - ".github/workflows/rust-esp32p4.yml"
  pull_request:
    paths:
      - "firmware-rust/apps/m1-firmware/**"
      - "firmware-rust/crates/**"
      - "firmware-rust/rust-toolchain.toml"
      - "firmware-rust/tools/**"
      - ".github/workflows/rust-esp32p4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p4:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware-rust/apps/m1-firmware

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add --toolchain 1.95.0 riscv32imafc-unknown-none-elf

      - name: P4 check (default)
        run: cargo +1.95.0 check --locked

      - name: Compile product modules (integration-check,hotcue-flash-storage)
        run: cargo +1.95.0 check --locked --features integration-check,hotcue-flash-storage

      - name: P4 build (default)
        run: cargo +1.95.0 build --locked --release

      - name: Compile product modules (integration-check,usb0-hardware-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,usb0-hardware-bringup

      - name: Compile product modules (integration-check,usb1-controller-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,usb1-controller-bringup

      - name: Compile product modules (integration-check,library-deck-load)
        run: cargo +1.95.0 check --locked --features integration-check,library-deck-load

      - name: Compile product modules (integration-check,wav-audio-source-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,wav-audio-source-bringup

      - name: Compile product modules (integration-check,pcm-transport-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,pcm-transport-bringup

      - name: Compile product modules (integration-check,render-graph-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,render-graph-bringup

      - name: Compile product modules (integration-check,sdmmc-profile-storage-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,sdmmc-profile-storage-bringup

      - name: Compile product modules (integration-check,p4-psram-storage)
        run: cargo +1.95.0 check --locked --features integration-check,p4-psram-storage

      - name: Compile product modules (integration-check,usb0-hardware-bringup,p4-psram-storage)
        run: cargo +1.95.0 check --locked --features integration-check,usb0-hardware-bringup,p4-psram-storage

      - name: Compile product modules (integration-check,usb0-hardware-bringup,usb1-controller-bringup,p4-psram-storage)
        run: cargo +1.95.0 check --locked --features integration-check,usb0-hardware-bringup,usb1-controller-bringup,p4-psram-storage

      - name: Compile product modules (integration-check,library-deck-load,sdmmc-profile-storage-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,library-deck-load,sdmmc-profile-storage-bringup

      - name: Compile product modules (integration-check,render-graph-bringup,sdmmc-profile-storage-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,render-graph-bringup,sdmmc-profile-storage-bringup

      - name: Compile product modules (integration-check)
        run: cargo +1.95.0 check --locked --features integration-check

      - name: P4 check (board-jc1060)
        run: cargo +1.95.0 check --locked --features board-jc1060

      - name: P4 build (board-jc1060)
        run: cargo +1.95.0 build --locked --release --features board-jc1060

      - name: P4 check (board-jc8012)
        run: cargo +1.95.0 check --locked --features board-jc8012

      - name: P4 build (board-jc8012)
        run: cargo +1.95.0 build --locked --release --features board-jc8012

      - name: P4 check (board-jc1060,board-diagnostics)
        run: cargo +1.95.0 check --locked --features board-jc1060,board-diagnostics

      - name: P4 build (board-jc1060,board-diagnostics)
        run: cargo +1.95.0 build --locked --release --features board-jc1060,board-diagnostics

      - name: P4 check (board-jc8012,board-diagnostics)
        run: cargo +1.95.0 check --locked --features board-jc8012,board-diagnostics

      - name: P4 build (board-jc8012,board-diagnostics)
        run: cargo +1.95.0 build --locked --release --features board-jc8012,board-diagnostics

      - name: P4 check (board-jc1060,guition-flash-probe)
        run: cargo +1.95.0 check --locked --release --features board-jc1060,guition-flash-probe

      - name: P4 build (board-jc1060,guition-flash-probe)
        run: cargo +1.95.0 build --locked --release --features board-jc1060,guition-flash-probe

      - name: P4 check (board-jc1060,guition-psram-test)
        run: cargo +1.95.0 check --locked --release --features board-jc1060,guition-psram-test

      - name: P4 build (board-jc1060,guition-psram-test)
        run: cargo +1.95.0 build --locked --release --features board-jc1060,guition-psram-test

      - name: P4 check (board-jc1060,guition-flash-probe,guition-psram-test)
        run: cargo +1.95.0 check --locked --release --features board-jc1060,guition-flash-probe,guition-psram-test

      - name: P4 build (board-jc1060,guition-flash-probe,guition-psram-test)
        run: cargo +1.95.0 build --locked --release --features board-jc1060,guition-flash-probe,guition-psram-test

      - name: P4 check (board-jc8012,guition-flash-probe)
        run: cargo +1.95.0 check --locked --release --features board-jc8012,guition-flash-probe

      - name: P4 build (board-jc8012,guition-flash-probe)
        run: cargo +1.95.0 build --locked --release --features board-jc8012,guition-flash-probe

      - name: P4 check (board-jc8012,guition-psram-test)
        run: cargo +1.95.0 check --locked --release --features board-jc8012,guition-psram-test

      - name: P4 build (board-jc8012,guition-psram-test)
        run: cargo +1.95.0 build --locked --release --features board-jc8012,guition-psram-test

      - name: P4 check (board-jc8012,guition-flash-probe,guition-psram-test)
        run: cargo +1.95.0 check --locked --release --features board-jc8012,guition-flash-probe,guition-psram-test

      - name: P4 build (board-jc8012,guition-flash-probe,guition-psram-test)
        run: cargo +1.95.0 build --locked --release --features board-jc8012,guition-flash-probe,guition-psram-test

      - name: Compile product modules (integration-check,usb0-hardware-bringup,runtime-health)
        run: cargo +1.95.0 check --locked --features integration-check,usb0-hardware-bringup,runtime-health

      - name: Compile product modules (integration-check,usb1-controller-bringup,runtime-health)
        run: cargo +1.95.0 check --locked --features integration-check,usb1-controller-bringup,runtime-health

      - name: Compile product modules (integration-check,render-graph-bringup,sdmmc-profile-storage-bringup,runtime-health)
        run: cargo +1.95.0 check --locked --features integration-check,render-graph-bringup,sdmmc-profile-storage-bringup,runtime-health

      - name: Compile product modules (integration-check,apta-usb0-bringup)
        run: cargo +1.95.0 check --locked --features integration-check,apta-usb0-bringup

      - name: Compile product modules (integration-check,apta-usb0-bringup,sdmmc-profile-storage-bringup,runtime-health)
        run: cargo +1.95.0 check --locked --features integration-check,apta-usb0-bringup,sdmmc-profile-storage-bringup,runtime-health

      - name: Reject unsupported board and diagnostic combinations
        run: python ../../tools/check_board_selection.py

      - name: Package separate Guition diagnostic images without flashing
        run: python ../../tools/guition_first_boot.py build --output "${{ runner.temp }}/guition-firstboot" --target-dir ../../target

      - name: Retain Guition first-boot packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guition-firstboot-diagnostics
          path: ${{ runner.temp }}/guition-firstboot/

      - name: Package opt-in Guition memory diagnostics without flashing
        run: |
          for probe in flash psram memory; do
            python ../../tools/guition_first_boot.py build --probe "$probe" --output "${{ runner.temp }}/guition-memory-$probe" --target-dir ../../target
          done

      - name: Retain Guition memory diagnostic packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guition-memory-diagnostics
          path: ${{ runner.temp }}/guition-memory-*/
