[package]
name = "pajoniiir-apta-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libapta = { git = "https://github.com/dvucinozd/libapta-audio.git", rev = "25d09de364e9507532c0508c838a8fecf0772d13", default-features = false }
pajoniiir-track-analysis.workspace = true
pajoniiir-waveform.workspace = true
embassy-futures = { version = "=0.1.2", default-features = false, optional = true }
pajoniiir-core = { workspace = true, optional = true }
pajoniiir-deck = { workspace = true, optional = true }
pajoniiir-media-session = { workspace = true, optional = true }
pajoniiir-media-catalog = { workspace = true, optional = true }
pajoniiir-media-identity = { workspace = true, optional = true }
pajoniiir-media-fs = { workspace = true, features = ["analysis-client"], optional = true }

[dev-dependencies]
pajoniiir-controller-core.workspace = true
pajoniiir-core.workspace = true
pajoniiir-deck.workspace = true
pajoniiir-media-fat32.workspace = true
pajoniiir-media-exfat.workspace = true
pajoniiir-media-io.workspace = true
pajoniiir-media-block.workspace = true
pajoniiir-controller-session.workspace = true
pajoniiir-mixer.workspace = true
pajoniiir-hot-cues.workspace = true
pajoniiir-audio-runtime.workspace = true
pajoniiir-service.workspace = true

[features]
default = []
workers = ["dep:embassy-futures", "dep:pajoniiir-core", "dep:pajoniiir-deck", "dep:pajoniiir-media-session", "dep:pajoniiir-media-catalog", "dep:pajoniiir-media-identity", "dep:pajoniiir-media-fs"]
owned-handoff = ["workers", "pajoniiir-track-analysis/owned"]
# Host source-inclusion of the actual Library-enabled ProductRuntime.
library-deck-load = ["owned-handoff"]

[[test]]
name = "broker"
required-features = ["workers"]
[[test]]
name = "job"
required-features = ["workers"]
[[test]]
name = "owner"
required-features = ["workers"]
[[test]]
name = "policy"
required-features = ["workers"]
[[test]]
name = "service"
required-features = ["workers"]
[[test]]
name = "source"
required-features = ["workers"]
[[test]]
name = "streaming"
required-features = ["workers"]
[[test]]
name = "worker"
required-features = ["workers"]
[[test]]
name = "product"
required-features = ["library-deck-load"]
