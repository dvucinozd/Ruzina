libapta = { git = "https://github.com/dvucinozd/libapta-audio.git", rev = "25d09de364e9507532c0508c838a8fecf0772d13", default-features = false }
pajoniiir-track-analysis.workspace = true
pajoniiir-waveform.workspace = true

pajoniiir-deck.workspace = true
pajoniiir-core.workspace = true
pajoniiir-media-session.workspace = true
pajoniiir-media-fs.workspace = true
pajoniiir-media-catalog.workspace = true
pajoniiir-media-identity.workspace = true

[dev-dependencies]
pajoniiir-media-fat32.workspace = true
pajoniiir-media-exfat.workspace = true
pajoniiir-media-io.workspace = true
pajoniiir-media-block.workspace = true
pajoniiir-controller-core.workspace = true

pajoniiir-controller-session.workspace = true
