[package]
name = "ruzina-media-load"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
ruzina-hot-cues = { workspace = true, optional = true }
ruzina-media-catalog.workspace = true
ruzina-media-fs.workspace = true
ruzina-media-identity.workspace = true
ruzina-media-session.workspace = true
ruzina-rekordbox = { path = "../ruzina-rekordbox", default-features = false }
ruzina-track-analysis = { workspace = true, optional = true }

[features]
default = ["alloc", "preflight"]
# Heap-backed PDB import stage (`pdb::VecCatalogStage`); capacity is reserved once.
alloc = []
# Per-track load preflight; its analysis publication allocates.
preflight = [
    "dep:ruzina-hot-cues",
    "dep:ruzina-track-analysis",
    "ruzina-rekordbox/analysis",
    "ruzina-track-analysis/owned",
]

[dev-dependencies]
ruzina-core.workspace = true
