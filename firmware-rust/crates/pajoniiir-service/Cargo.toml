[package]
name = "pajoniiir-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
owner-adapters = ["dep:pajoniiir-audio-runtime", "dep:pajoniiir-control-scheduler"]
runtime-owners = ["dep:pajoniiir-controller-session", "dep:pajoniiir-control-scheduler", "dep:pajoniiir-media-session"]

[dependencies]
pajoniiir-core.workspace = true
pajoniiir-board-profile = { path = "../pajoniiir-board-profile" }
pajoniiir-audio-runtime = { workspace = true, optional = true }
pajoniiir-control-scheduler = { workspace = true, optional = true }
pajoniiir-controller-session = { workspace = true, optional = true }
pajoniiir-media-session = { workspace = true, optional = true }

[dev-dependencies]
pajoniiir-controller-core.workspace = true
pajoniiir-audio-runtime.workspace = true
pajoniiir-controller-session.workspace = true
pajoniiir-deck.workspace = true
pajoniiir-hot-cues.workspace = true
pajoniiir-media-catalog.workspace = true
pajoniiir-mixer.workspace = true
pajoniiir-track-analysis.workspace = true

[[test]]
name = "runtime_owners"
required-features = ["runtime-owners"]

[[test]]
name = "composed_failures"
required-features = ["runtime-owners"]
