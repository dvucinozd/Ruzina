[package]
name = "pajoniiir-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
owner-adapters = ["dep:pajoniiir-audio-runtime", "dep:pajoniiir-control-scheduler"]

[dependencies]
pajoniiir-core.workspace = true
pajoniiir-board-profile = { path = "../pajoniiir-board-profile" }
pajoniiir-audio-runtime = { workspace = true, optional = true }
pajoniiir-control-scheduler = { workspace = true, optional = true }

[dev-dependencies]
pajoniiir-controller-core.workspace = true
