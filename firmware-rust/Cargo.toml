pajoniiir-media-session = { path = "crates/pajoniiir-media-session" }
pajoniiir-media-usb-msc = { path = "crates/pajoniiir-media-usb-msc" }
pajoniiir-rekordbox = { path = "crates/pajoniiir-rekordbox" }
