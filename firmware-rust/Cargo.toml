ruzina-ota = { path = "crates/ruzina-ota" }
ruzina-media-block = { path = "crates/ruzina-media-block" }
ruzina-media-catalog = { path = "crates/ruzina-media-catalog" }
ruzina-media-exfat = { path = "crates/ruzina-media-exfat" }
ruzina-media-fat32 = { path = "crates/ruzina-media-fat32" }
ruzina-media-fs = { path = "crates/ruzina-media-fs" }
ruzina-media-identity = { path = "crates/ruzina-media-identity" }
ruzina-media-io = { path = "crates/ruzina-media-io" }
ruzina-media-load = { path = "crates/ruzina-media-load" }
ruzina-media-partition = { path = "crates/ruzina-media-partition" }
ruzina-media-session = { path = "crates/ruzina-media-session" }
ruzina-media-usb-msc = { path = "crates/ruzina-media-usb-msc" }
ruzina-rekordbox = { path = "crates/ruzina-rekordbox" }
ruzina-service = { path = "crates/ruzina-service" }
ruzina-settings = { path = "crates/ruzina-settings" }
ruzina-track-analysis = { path = "crates/ruzina-track-analysis" }
ruzina-uac = { path = "crates/ruzina-uac" }
ruzina-ui-model = { path = "crates/ruzina-ui-model" }
ruzina-waveform = { path = "crates/ruzina-waveform" }
