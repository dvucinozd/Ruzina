[workspace]
members = [
    "crates/ruzina-apta-adapter",
    "apps/desktop-simulator",
    "crates/ruzina-audio-dsp",
    "crates/ruzina-audio-keylock",
    "crates/ruzina-audio-runtime",
    "crates/ruzina-audio-scratch",
    "crates/ruzina-board-profile",
    "crates/ruzina-core",
    "crates/ruzina-controller-core",
    "crates/ruzina-controller-profile",
    "crates/ruzina-controller-profile-storage",
    "crates/ruzina-controller-session",
    "crates/ruzina-controller-usb",
    "crates/ruzina-control-scheduler",
    "crates/ruzina-deck",
    "crates/ruzina-hot-cues",
    "crates/ruzina-mixer",
    "crates/ruzina-ota",
    "crates/ruzina-media-block",
    "crates/ruzina-media-catalog",
    "crates/ruzina-media-exfat",
    "crates/ruzina-media-fat32",
    "crates/ruzina-media-fs",
    "crates/ruzina-media-identity",
    "crates/ruzina-media-io",
    "crates/ruzina-media-load",
    "crates/ruzina-media-partition",
    "crates/ruzina-media-session",
    "crates/ruzina-media-usb-msc",
    "crates/ruzina-rekordbox",
    "crates/ruzina-service",
    "crates/ruzina-settings",
    "crates/ruzina-track-analysis",
    "crates/ruzina-uac",
    "crates/ruzina-ui-model",
    "crates/ruzina-waveform",
    "crates/ruzina-web",
]
default-members = [
    "apps/desktop-simulator",
    "crates/ruzina-audio-dsp",
    "crates/ruzina-audio-keylock",
    "crates/ruzina-audio-runtime",
    "crates/ruzina-audio-scratch",
    "crates/ruzina-board-profile",
    "crates/ruzina-core",
    "crates/ruzina-controller-core",
    "crates/ruzina-controller-profile",
    "crates/ruzina-controller-profile-storage",
    "crates/ruzina-controller-session",
    "crates/ruzina-controller-usb",
    "crates/ruzina-control-scheduler",
    "crates/ruzina-deck",
    "crates/ruzina-hot-cues",
    "crates/ruzina-mixer",
    "crates/ruzina-ota",
    "crates/ruzina-media-block",
    "crates/ruzina-media-catalog",
    "crates/ruzina-media-exfat",
    "crates/ruzina-media-fat32",
    "crates/ruzina-media-fs",
    "crates/ruzina-media-identity",
    "crates/ruzina-media-io",
    "crates/ruzina-media-load",
    "crates/ruzina-media-partition",
    "crates/ruzina-media-session",
    "crates/ruzina-rekordbox",
    "crates/ruzina-service",
    "crates/ruzina-settings",
    "crates/ruzina-track-analysis",
    "crates/ruzina-uac",
    "crates/ruzina-ui-model",
    "crates/ruzina-waveform",
    "crates/ruzina-web",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
embedded-graphics = { version = "=0.8.2", default-features = false }
embedded-sdmmc = { version = "=0.10.0", default-features = false }
exfat-embedded = { version = "=0.1.3", default-features = false }
libm = "=0.2.16"
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
sha2 = { version = "=0.10.9", default-features = false }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-x11", "renderer-software", "compat-1-18"] }
slint-build = { version = "=1.18.1" }

ruzina-audio-dsp = { path = "crates/ruzina-audio-dsp" }
ruzina-audio-keylock = { path = "crates/ruzina-audio-keylock" }
ruzina-audio-runtime = { path = "crates/ruzina-audio-runtime" }
ruzina-audio-scratch = { path = "crates/ruzina-audio-scratch" }
ruzina-core = { path = "crates/ruzina-core" }
ruzina-controller-core = { path = "crates/ruzina-controller-core" }
ruzina-controller-profile = { path = "crates/ruzina-controller-profile" }
ruzina-controller-profile-storage = { path = "crates/ruzina-controller-profile-storage" }
ruzina-controller-session = { path = "crates/ruzina-controller-session" }
ruzina-controller-usb = { path = "crates/ruzina-controller-usb" }
ruzina-control-scheduler = { path = "crates/ruzina-control-scheduler" }
ruzina-deck = { path = "crates/ruzina-deck" }
