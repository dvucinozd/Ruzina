[package]
name = "ruzina-m1-firmware"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[features]
default = []
# Compile owner modules without acquiring board resources or spawning them.
integration-check = []
# Explicit Guition board identity; idle unless diagnostic probes are selected.
board-jc1060 = []
board-jc8012 = []
# Opt-in USB Serial/JTAG first-boot report; no storage or audio activation.
board-diagnostics = []
# Separate Guition-only diagnostic images. Neither selects product storage owners.
guition-flash-probe = ["board-diagnostics", "dep:critical-section"]
guition-psram-test = ["board-diagnostics"]
# Diagnostic-only bounded publication from product owner modules.
# Does not enable any USB owner or select Guition pins.
runtime-health = ["ruzina-service/runtime-owners"]
# Compile-verified target wiring only. Do not enable in normal firmware until
# USB0 VBUS/power switching, PHY and hot-plug are physically verified.
usb0-hardware-bringup = []
# Compile-verified USB1 Full-Speed controller ownership/enumeration boundary.
# The BSP must provide a qualified USB instance. No port/pin map is selected.
usb1-controller-bringup = ["hotcue-flash-storage"]
# Compile-verified internal-flash Hot Cue journal. This feature is implied by
# USB1 product control because a controller must not acknowledge Hot Cue changes
# without a durable owner.
hotcue-flash-storage = ["dep:esp-storage"]
# End-to-end Library browse/load ownership: published PSRAM catalog + USB0
# filesystem clients + USB1 semantic controls + durable Hot Cue flash owner.
library-deck-load = [
    "ruzina-media-load/preflight",
    "ruzina-rekordbox/analysis",
    "ruzina-track-analysis/owned",
    "usb0-hardware-bringup",
    "usb1-controller-bringup",
    "p4-psram-storage",
]
# Enables WAV PCM16, MP3 and native FLAC source owners.
# Bounded shared decoders retain per-deck file handles and fixed PCM queues.
# Physical filesystem/PSRAM/output timing remains a bring-up gate.
wav-audio-source-bringup = ["library-deck-load"]
# Continuous bounded source-to-transport path. Source owners prefetch decoded
# PCM into fixed-capacity per-deck queues; the transport owner consumes only
# generation-matched blocks and owns seek/EOF state transitions.
pcm-transport-bringup = ["wav-audio-source-bringup"]
# Fixed-rate software render graph ownership boundary. The render owner becomes
# the only steady-state PCM consumer and returns compact progress to transport.
# Output is still a reference/null sink; physical I2S/UAC remains a later hardware gate.
render-graph-bringup = ["pcm-transport-bringup"]
# Compile-only optional analysis integration; Guition selectors remain guarded.
# Analysis yields storage to foreground and is cancelled while playback is active.
apta-usb0-bringup = ["render-graph-bringup", "dep:ruzina-apta-adapter", "dep:libapta"]
# Compile-verified M1 microSD SDMMC0 ownership and card-init boundary. Runtime
# card/FAT/profile success still requires physical qualification.
sdmmc-profile-storage-bringup = []
# Compile-verified PSRAM allocator boundary for large retained library/UI storage.
# This does not claim DMA/cache coherency or hardware qualification.
p4-psram-storage = ["dep:esp-alloc", "dep:allocator-api2", "ruzina-media-load/alloc"]

[dependencies]
critical-section = { version = "=1.2.0", optional = true }
libapta = { git = "https://github.com/dvucinozd/libapta-audio.git", rev = "25d09de364e9507532c0508c838a8fecf0772d13", default-features = false, optional = true }
ruzina-apta-adapter = { path = "../../crates/ruzina-apta-adapter", features = ["owned-handoff"], optional = true }
allocator-api2 = { version = "=0.3.1", default-features = false, features = ["alloc"], optional = true }
ruzina-board-profile = { path = "../../crates/ruzina-board-profile" }
ruzina-service = { path = "../../crates/ruzina-service" }
aligned = { version = "=0.4.3", default-features = false }
block-device-driver = { version = "=0.2.0", default-features = false }
embassy-executor = { version = "=0.10.0", default-features = false }
embassy-futures = { version = "=0.1.2", default-features = false }
embassy-usb-driver = { version = "=0.2.2", default-features = false }
embassy-usb-host = { version = "=0.1.0", default-features = false }
embassy-sync = { version = "=0.8.0", default-features = false }
embassy-time = { version = "=0.5.1", default-features = false }
esp-alloc = { version = "=0.11.0", default-features = false, features = ["esp32p4", "global-allocator"], optional = true }
esp-hal = { version = "=1.2.2", features = ["esp32p4", "unstable"] }
esp-rtos = { version = "=0.4.0", default-features = false, features = ["embassy", "esp32p4"] }
esp-storage = { version = "=0.10.0", default-features = false, features = ["critical-section", "esp32p4"], optional = true }
sdio = { version = "=0.5.1", default-features = false }
static_cell = { version = "=2.1.1", default-features = false }
ruzina-audio-dsp = { path = "../../crates/ruzina-audio-dsp" }
ruzina-audio-keylock = { path = "../../crates/ruzina-audio-keylock" }
ruzina-audio-runtime = { path = "../../crates/ruzina-audio-runtime" }
ruzina-controller-core = { path = "../../crates/ruzina-controller-core" }
ruzina-core = { path = "../../crates/ruzina-core" }
ruzina-controller-profile-storage = { path = "../../crates/ruzina-controller-profile-storage" }
ruzina-controller-session = { path = "../../crates/ruzina-controller-session" }
ruzina-controller-usb = { path = "../../crates/ruzina-controller-usb" }
ruzina-deck = { path = "../../crates/ruzina-deck" }
ruzina-hot-cues = { path = "../../crates/ruzina-hot-cues" }
ruzina-mixer = { path = "../../crates/ruzina-mixer" }
ruzina-media-block = { path = "../../crates/ruzina-media-block" }
ruzina-media-catalog = { path = "../../crates/ruzina-media-catalog" }
ruzina-media-exfat = { path = "../../crates/ruzina-media-exfat" }
ruzina-media-fat32 = { path = "../../crates/ruzina-media-fat32" }
ruzina-media-fs = { path = "../../crates/ruzina-media-fs" }
ruzina-media-identity = { path = "../../crates/ruzina-media-identity" }
ruzina-media-io = { path = "../../crates/ruzina-media-io" }
ruzina-media-load = { path = "../../crates/ruzina-media-load", default-features = false }
ruzina-media-partition = { path = "../../crates/ruzina-media-partition" }
ruzina-media-session = { path = "../../crates/ruzina-media-session" }
ruzina-media-usb-msc = { path = "../../crates/ruzina-media-usb-msc" }
ruzina-rekordbox = { path = "../../crates/ruzina-rekordbox", default-features = false }
ruzina-track-analysis = { path = "../../crates/ruzina-track-analysis" }
ruzina-ui-model = { path = "../../crates/ruzina-ui-model" }
ruzina-waveform = { path = "../../crates/ruzina-waveform" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[workspace]
resolver = "2"
